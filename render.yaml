services:
  - type: web
    name: resoq-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: PORT
        value: 8000
      - key: HYPERLIQUID_NETWORK
        value: testnet

  - type: web
    name: resoq-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_WS_URL
        fromService:
          name: resoq-backend
          type: web
          property: host
